[project]
name = "ImageEditor"
dependencies = [ "PySide6==6.11.2", ]

[project.optional-dependencies]
edit = [
    "numpy==2.2.6",
    "pillow==12.3.0",
    "rembg[cpu]==2.0.69",
]

[tool.ruff]
line-length = 200
extend-exclude = ['resources.py']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM', 'RUF']
